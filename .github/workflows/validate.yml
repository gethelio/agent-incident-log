name: validate

on:
  pull_request:

# Read-only, deliberately.
#
# A pull_request run triggered from a fork receives a read-only GITHUB_TOKEN no
# matter what is requested here, so asking for `pull-requests: write` bought
# nothing: it worked for branches pushed to this repo and returned 403 for
# exactly the external contributors the comment exists to serve. The comment is
# posted by validate-comment.yml, which runs on workflow_run in the base
# repository's context and does have a writable token.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Validate incidents
        id: validate
        working-directory: scripts
        run: npm run validate

      - name: Collect front matter for PR comment
        # `always()` so a contributor whose entry failed validation still gets
        # the parsed view. That is the case where seeing how CI read the file
        # is most useful, and the old workflow skipped it.
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const { execFileSync } = require('child_process')
            const base = process.env.GITHUB_BASE_REF || 'main'
            let diff
            try {
              diff = execFileSync(
                'git',
                ['diff', '--name-only', `origin/${base}...HEAD`, '--', 'incidents/'],
                { encoding: 'utf8' },
              )
            } catch {
              diff = execFileSync(
                'git',
                ['diff', '--name-only', `${base}...HEAD`, '--', 'incidents/'],
                { encoding: 'utf8' },
              )
            }
            const files = diff
              .split('\n')
              .map((s) => s.trim())
              .filter((s) => s.endsWith('.md'))

            fs.mkdirSync('comment', { recursive: true })

            // The PR number travels inside the artifact. A workflow_run event
            // exposes the head branch and SHA but not the number, and resolving
            // it by branch name is ambiguous once forks are involved — two
            // forks can both offer a branch called `patch-1`.
            fs.writeFileSync('comment/pr-number', String(context.issue.number))

            if (files.length === 0) {
              fs.writeFileSync('comment/body.md', '')
              return
            }

            // Parse YAML front matter without adding a runtime dep in the action
            const blocks = []
            for (const file of files) {
              if (!fs.existsSync(file)) {
                blocks.push(`### \`${file}\`\n\n_File removed in this PR._`)
                continue
              }
              const raw = fs.readFileSync(file, 'utf8')
              const match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---/)
              const fm = match ? match[1].trim() : '_No front matter found._'
              blocks.push(`### \`${file}\`\n\n\`\`\`yaml\n${fm}\n\`\`\``)
            }
            const body = [
              '<!-- incident-front-matter -->',
              '## Parsed incident front matter',
              '',
              'Structured fields as CI sees them (substitute for a deploy preview):',
              '',
              ...blocks,
            ].join('\n')
            fs.writeFileSync('comment/body.md', body)

      - name: Upload comment payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-front-matter
          path: comment/
          retention-days: 1
