name: publish

on:
  push:
    branches: [main]
    paths:
      - 'incidents/**'
      - 'schema/**'
      - 'scripts/**'
  # Manual trigger. Rebuilds and republishes the dataset without a content
  # change — the recovery lever when a deploy hook has failed, or when the
  # site needs to be forced back into sync.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Validate
        working-directory: scripts
        run: npm run validate

      - name: Build dist/incidents.json
        working-directory: scripts
        run: npm run build

      - name: Commit generated files if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # README.md as well as the dataset: build.mjs regenerates the
          # distribution sentence between its markers, and staging only dist
          # would leave that edit behind in the runner and the counter stale
          # on the front page.
          git add dist/incidents.json README.md
          if git diff --staged --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'chore: regenerate dataset and README counter'
            git push
          fi

      # No `if:` guard here on purpose. A step-level env var is not visible to
      # that same step's `if` expression, so gating on it silently skips the
      # step forever. A notification that never fires without saying so is the
      # worst failure mode available: helio.so would serve stale data
      # indefinitely and nothing would report it. Always run, and be loud.
      - name: Notify helio.so
        env:
          # helio.so's cache-purge endpoint, shared secret included in the query
          # string. Not a Vercel deploy hook, despite what this secret was
          # called until August 2026: a deploy hook does not propagate new
          # entries at all, because Next's Data Cache survives deployments and
          # Vercel restores `.next/cache` between builds, so the rebuild
          # re-serves the payload cached before the merge and deploys without
          # the new entry, green the whole way. The old name sent readers to
          # look for a hook in the Vercel dashboard, and the risk was that one
          # of them would helpfully create it.
          INCIDENT_REVALIDATE_URL: ${{ secrets.INCIDENT_REVALIDATE_URL }}
        run: |
          if [ -z "$INCIDENT_REVALIDATE_URL" ]; then
            echo "::warning title=Revalidation URL not configured::INCIDENT_REVALIDATE_URL is not set. The dataset was rebuilt but helio.so was NOT notified, and will serve stale data until the weekly revalidate catches up."
            exit 0
          fi
          # -L because helio.so and www.helio.so redirect to one another and the
          # direction can change. Without it curl neither follows the redirect
          # nor treats it as an error, so posting to the wrong one of the pair
          # exits 0 having reached nothing and this step reports success while
          # the site quietly serves stale data — the same failure this step's
          # `if:` comment above is guarding against, arriving by a different
          # route.
          #
          # --fail-with-body rather than -f so a rejection is readable. The
          # receiving endpoint validates the dataset before acting and replies
          # with the offending entry and field; plain -f discards that and
          # leaves only an exit code to go on.
          curl --fail-with-body -sSL -X POST "$INCIDENT_REVALIDATE_URL"
          echo "helio.so notified."
