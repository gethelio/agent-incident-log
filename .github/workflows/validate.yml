name: validate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Validate incidents
        id: validate
        working-directory: scripts
        run: npm run validate

      - name: Collect front matter for PR comment
        if: github.event_name == 'pull_request'
        id: frontmatter
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const { execFileSync } = require('child_process')
            const base = process.env.GITHUB_BASE_REF || 'main'
            let diff
            try {
              diff = execFileSync(
                'git',
                ['diff', '--name-only', `origin/${base}...HEAD`, '--', 'incidents/'],
                { encoding: 'utf8' },
              )
            } catch {
              diff = execFileSync(
                'git',
                ['diff', '--name-only', `${base}...HEAD`, '--', 'incidents/'],
                { encoding: 'utf8' },
              )
            }
            const files = diff
              .split('\n')
              .map((s) => s.trim())
              .filter((s) => s.endsWith('.md'))
            if (files.length === 0) {
              core.setOutput('body', '')
              return
            }
            // Parse YAML front matter without adding a runtime dep in the action
            const blocks = []
            for (const file of files) {
              if (!fs.existsSync(file)) {
                blocks.push(`### \`${file}\`\n\n_File removed in this PR._`)
                continue
              }
              const raw = fs.readFileSync(file, 'utf8')
              const match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---/)
              const fm = match ? match[1].trim() : '_No front matter found._'
              blocks.push(`### \`${file}\`\n\n\`\`\`yaml\n${fm}\n\`\`\``)
            }
            const body = [
              '<!-- incident-front-matter -->',
              '## Parsed incident front matter',
              '',
              'Structured fields as CI sees them (substitute for a deploy preview):',
              '',
              ...blocks,
            ].join('\n')
            core.setOutput('body', body)

      - name: Post or update PR comment
        if: github.event_name == 'pull_request' && steps.frontmatter.outputs.body != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.BODY
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const marker = '<!-- incident-front-matter -->'
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }
        env:
          BODY: ${{ steps.frontmatter.outputs.body }}
