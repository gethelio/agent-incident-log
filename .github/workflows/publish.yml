name: publish

on:
  push:
    branches: [main]
    paths:
      - 'incidents/**'
      - 'schema/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Validate
        working-directory: scripts
        run: npm run validate

      - name: Build dist/incidents.json
        working-directory: scripts
        run: npm run build

      - name: Commit dist if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/incidents.json
          if git diff --staged --quiet; then
            echo 'No dist changes'
          else
            git commit -m 'chore: regenerate dist/incidents.json'
            git push
          fi

      # No `if:` guard here on purpose. A step-level env var is not visible to
      # that same step's `if` expression, so gating on it silently skips the
      # step forever. A deploy hook that never fires without saying so is the
      # worst failure mode available: helio.so would serve stale data
      # indefinitely and nothing would report it. Always run, and be loud.
      - name: Trigger helio.so deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning title=Deploy hook not configured::VERCEL_DEPLOY_HOOK_URL is not set. The dataset was rebuilt but helio.so was NOT notified, and will serve stale data until this secret is added."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "helio.so deploy hook triggered."
